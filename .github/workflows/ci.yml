name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-smoke:
    name: Build + smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      - name: Interpreter smoke
        run: cargo run --quiet -- run ci/smoke.hyp

      - name: Compiler JIT smoke
        run: cargo run --quiet -- compile ci/smoke.hyp

      - name: Compiler emit-exe smoke
        run: |
          cargo run --quiet -- compile ci/smoke.hyp --emit-exe /tmp/hyper_smoke
          /tmp/hyper_smoke
