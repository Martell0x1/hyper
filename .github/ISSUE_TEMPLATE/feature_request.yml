name: Feature request
description: Propose a new language feature, stdlib addition, or tooling improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Hyper v0.1 focuses on a **working compile path for core programs**, not full parity with the interpreter.
        Say whether you need this for **run**, **compile**, or **both**.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do? Why is the current language or tooling insufficient?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Syntax sketch, API shape, or behavior you have in mind.
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Needed on
      options:
        - interpreter (`hyper run`)
        - compiler (`hyper compile` / `--emit-exe`)
        - both
        - tooling / docs / CI only
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds, other languages, or a smaller subset that would already help.

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Links to docs, examples, or related issues.
